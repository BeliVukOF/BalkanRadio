name: balkan_radio
description: "Radio streaming app for the Balkans."
publish_to: 'none'
version: 1.1.6+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  shared_preferences: ^2.2.2
  http: ^1.2.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
